name: Main CI

on: [push]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install
      run: npm install
    - name: Lint
      run: npm run lint
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install
      run: npm install
    - name: Get Playwright version
      id: playwright-version
      run: >-
        echo "version=$(npm ls @playwright/test --json
        | node -p 'JSON.parse(require("fs").readFileSync(0)).dependencies["@playwright/test"].version')"
        >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright browser binaries
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium firefox webkit
    - name: Install Playwright OS dependencies
      run: npx playwright install-deps chromium firefox webkit
    - name: Test
      run: npm test
