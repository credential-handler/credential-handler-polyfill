name: Main CI

on: [push]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install
      run: npm install
    - name: Lint
      run: npm run lint
  test:
    runs-on: ubuntu-latest
    # official Playwright image ships chromium, firefox, and webkit plus their
    # OS dependencies pre-installed, so no browser download/apt step is needed;
    # keep the tag in sync with the `@playwright/test` version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install
      run: npm install
    - name: Test
      run: npm test
